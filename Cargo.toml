[workspace]
members = [
  "src/rust/core",
  "src/rust/cli",
]
resolver = "2"

[workspace.package]
authors = ["Christian Helle"]
edition = "2024"
homepage = "https://christianhelle.com/httpgenerator/"
license = "MIT"
repository = "https://github.com/christianhelle/httpgenerator"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
httpgenerator-core = { version = "0.1.0", path = "src/rust/core" }
oasreader = { version = "0.1.0", features = ["typed"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
ureq = { version = "3.4.1", default-features = false, features = [
  "rustls",
] }
url = "2.5.7"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
